name: API gap
description: You had to work around SurveyJS in your application code. Tell us which API you expected instead.
title: "[API gap] "
labels: ["api-gap", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        SurveyJS adds small API improvements (a property, an event, an option) quickly, often in the next weekly release.
        Please don't include application code beyond the workaround, credentials or real data.
        Survey Creator issues go to https://github.com/surveyjs/survey-creator/issues.
  - type: input
    id: version
    attributes:
      label: Package and version
      description: For example, survey-core 3.2.4 and survey-react-ui 3.2.4.
      placeholder: survey-core 3.2.4, survey-react-ui 3.2.4
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you needed
      description: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: The workaround you wrote
      description: Private members, prototype patches, DOM or CSS changes inside SurveyJS markup, timers that wait for survey state, and so on.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected-api
    attributes:
      label: The API you expected
      description: A property, an event, a method or an option, and how you would call it.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Minimal survey JSON
      description: The smallest survey JSON that shows the case.
      render: json
    validations:
      required: false
