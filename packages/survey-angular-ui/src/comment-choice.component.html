<div *ngIf="question.isViewMode" [class]="question.viewModeCssClass">{{ question.getCommentViewText(item) }}</div>
<ng-container *ngIf="!question.isViewMode && !question.isReadOnlyRenderDiv()">
  <ng-template [component]="{ name: 'sv-text-area', data: { model: textAreaModel } }"></ng-template>
</ng-container>
<div *ngIf="!question.isViewMode && question.isReadOnlyRenderDiv()">{{ commentValue }}</div>
