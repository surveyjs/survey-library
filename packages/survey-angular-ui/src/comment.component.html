<div *ngIf="question.isViewMode" [class]="question.viewModeCssClass">{{ question.getCommentViewText() }}</div>
<ng-container *ngIf="!question.isViewMode && !question.isReadOnlyRenderDiv()">
  <ng-template [component]="{ name: 'sv-text-area', data: { model: question.commentTextAreaModel } }"></ng-template>
</ng-container>
<div *ngIf="!question.isViewMode && question.isReadOnlyRenderDiv()">{{ question.comment }}</div>
