<ng-template #template>
  <button *ngIf="model" type="button" (click)="model.doAction($event)" (mousedown)="model.doMouseDown($event)" (focus)="model.doFocus($event)" [key2click]="{ processEsc: false, disableTabStop: model.disableTabStop }" [class]="model.getActionBarItemCss()" [attr.title]="model.getTooltip()" [attr.aria-checked]="model.ariaChecked" [attr.aria-expanded]="model.ariaExpanded" [attr.aria-labelledby]="model.ariaLabelledBy" [attr.aria-controls]="model.ariaControls" [attr.role]="model.ariaRole" [disabled]="model.disabled" #container>
    <svg *ngIf="model.iconName" [iconName]="model.iconName" [size]="model.iconSize" [title]="model.tooltip || model.title" [class]="model.cssClasses.itemIcon" sv-ng-svg-icon></svg>
    <ng-container *ngIf="model.hasTitle">
      <ng-template [component]="{ name: model.locTitle.renderAs, data: { model: model.locTitle.renderAsData, textClass: model.getActionBarItemTitleCss() } }"></ng-template>
    </ng-container>
  </button>
<ng-template>
