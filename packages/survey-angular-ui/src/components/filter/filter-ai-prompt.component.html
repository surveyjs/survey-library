<ng-template #template>
  <div *ngIf="!!prompt && !prompt.isDisposed" [class]="css.aiPrompt">
    <div [class]="css.aiPromptTitle">{{ prompt.promptTitle }}</div>
    <sv-ng-filter-editor-page [survey]="prompt.form" [disposed]="prompt.isDisposed" [className]="formCss"></sv-ng-filter-editor-page>
    <div [class]="css.aiPromptRequest">
      <sv-ng-action-bar [model]="prompt.requestToolbar"></sv-ng-action-bar>
    </div>
    <div *ngIf="!!prompt.errorText" [class]="css.aiPromptError" role="alert">{{ prompt.errorText }}</div>
  </div>
</ng-template>
