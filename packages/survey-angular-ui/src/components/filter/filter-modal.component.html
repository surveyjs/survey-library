<ng-template #template>
  <div *ngIf="!!modal" [class]="modal.cssClasses.modalContent">
    <div [class]="modal.cssClasses.modalSection">
      <div [class]="modal.searchCss.root">
        <svg [iconName]="'icon-search-24x24'" [size]="'auto'" [partCss]="modal.cssClasses.searchIcon" sv-ng-svg-icon></svg>
        <input type="text" [class]="modal.searchCss.control" [value]="modal.filterText" [attr.placeholder]="modal.searchPlaceholder"
          [attr.aria-label]="modal.searchPlaceholder" (input)="onSearchInput($event)" />
        <sv-action-bar-item *ngIf="modal.showSearchClear" [model]="modal.searchClearAction"></sv-action-bar-item>
      </div>
    </div>
    <div *ngIf="modal.presetsToolbar.hasVisibleActions" [class]="modal.cssClasses.modalSection" role="group" [attr.aria-labelledby]="modal.presetsTitleId">
      <div [class]="modal.cssClasses.modalSectionHeader">
        <div [class]="modal.cssClasses.modalSectionTitle" [attr.id]="modal.presetsTitleId">{{ presetsTitle }}</div>
      </div>
      <sv-ng-action-bar [model]="modal.presetsToolbar"></sv-ng-action-bar>
    </div>
    <div *ngIf="modal.showExpression" [class]="modal.cssClasses.modalSection + ' ' + modal.cssClasses.modalExpression">
      <div [class]="modal.cssClasses.modalSectionTitle">{{ modal.expressionTitle }}</div>
      <div [class]="modal.cssClasses.modalExpressionText">{{ modal.presetExpression }}</div>
      <sv-ng-action-bar [model]="modal.expressionToolbar"></sv-ng-action-bar>
    </div>
    <div *ngIf="modal.isNothingFound" [class]="modal.cssClasses.modalNothingFound">
      <svg [iconName]="'icon-search-24x24'" [size]="'auto'" [partCss]="modal.cssClasses.modalNothingFoundIcon" sv-ng-svg-icon></svg>
      <div>{{ modal.nothingFoundText }}</div>
    </div>
    <sv-ng-filter-editor-page *ngIf="!!modal.editor" [survey]="modal.editor.survey" [disposed]="modal.editor.isDisposed"
      [className]="modal.editorCss"></sv-ng-filter-editor-page>
  </div>
</ng-template>
