<ng-template #template>
  <div *ngIf="!!dialog" [class]="contentCss">
    <div *ngIf="!!edit && edit.tabsToolbar.hasActions" [class]="css.presetTabs">
      <sv-ng-action-bar [model]="edit.tabsToolbar"></sv-ng-action-bar>
    </div>
    <sv-ng-filter-editor-page *ngIf="!!dialog.form" [survey]="dialog.form" [disposed]="dialog.isDisposed" [className]="formCss"></sv-ng-filter-editor-page>
    <sv-ng-filter-editor-page *ngIf="hasFields" [survey]="dialog.survey" [disposed]="dialog.isDisposed" [className]="editorCss"></sv-ng-filter-editor-page>
    <div *ngIf="!!edit && edit.actionsToolbar.hasVisibleActions" [class]="css.modalSection">
      <div [class]="css.modalSectionTitle">{{ actionsTitle }}</div>
      <sv-ng-action-bar [model]="edit.actionsToolbar"></sv-ng-action-bar>
    </div>
  </div>
</ng-template>
