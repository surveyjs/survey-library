<ng-template #template>
  <div [class]="question.cssClasses.dragHandle" role="button" tabindex="0" [attr.aria-label]="model.ariaLabel"
    (pointerdown)="question.onPointerDown($event, row)" (keydown)="question.onDragHandleKeyDown($event, row)">
    <svg *ngIf="question.iconDragElement" [partCss]="question.cssClasses.dragElementDecorator" [iconName]="$any(model.iconName)" [size]="model.iconSize" sv-ng-svg-icon></svg>
    <span *ngIf="!question.iconDragElement" data-bind="css: question.cssClasses.iconDrag"></span>
  </div>
</ng-template>
