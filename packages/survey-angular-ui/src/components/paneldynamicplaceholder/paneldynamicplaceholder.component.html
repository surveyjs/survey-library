<div *ngIf="question.getShowNoEntriesPlaceholder()" [class]="question.cssClasses.noEntriesPlaceholder">
  <span [attr.id]="question.noEntriesTextId">
    <sv-ng-string [model]="question.locNoEntriesText"></sv-ng-string>
  </span>
  <ng-template [component]="{ name: 'sv-action-bar', data: { model: question.footerToolbar } }" *ngIf="question.getShowPlaceholderToolbar()"></ng-template>
</div>
