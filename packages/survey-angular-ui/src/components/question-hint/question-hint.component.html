<ng-container *ngIf="keyboardHintModel as hintModel">
  <div *ngIf="hintModel.hasItems()" [class]="hintModel.cssClasses.keyboardHintContainer" aria-hidden="true">
    <span *ngFor="let hint of hintModel.items; trackBy: trackByIndex" [class]="hint.className">
      <ng-container *ngTemplateOutlet="hintParts; context: { $implicit: hint }"></ng-container>
      <span *ngFor="let alternative of hint.alternatives; trackBy: trackByIndex" [class]="alternative.className">
        <ng-container *ngTemplateOutlet="hintParts; context: { $implicit: alternative }"></ng-container>
      </span>
    </span>
  </div>
</ng-container>
<ng-template #hintParts let-hint>
  <span *ngFor="let part of hint.parts; trackBy: trackByIndex" [class]="part.className">{{ part.text }}</span>
</ng-template>
