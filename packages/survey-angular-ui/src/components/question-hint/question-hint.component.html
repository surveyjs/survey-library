<div *ngIf="keyboardHintModel.hasItems()" [class]="keyboardHintModel.cssClasses.keyboardHintContainer" aria-hidden="true">
  <span *ngFor="let hint of keyboardHintModel.items" [class]="keyboardHintModel.cssClasses.keyboardHintItem">
    <span *ngFor="let part of hint.parts" [class]="part.className">{{ part.text }}</span>
  </span>
</div>
