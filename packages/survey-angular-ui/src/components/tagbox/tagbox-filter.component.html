<ng-template #template>
  <div [class]="question.cssClasses.hint">
    <div *ngIf="renderState.showHintPrefix" [class]="question.cssClasses.hintPrefix">
      <span>{{ renderState.hintStringPrefix }}</span>
    </div>
    <div [class]="question.cssClasses.hintSuffixWrapper">
      <div *ngIf="renderState.showHintString" [class]="question.cssClasses.hintSuffix">
        <span style="visibility: hidden">{{ renderState.inputStringRendered }}</span>
        <span>{{ renderState.hintStringSuffix }}</span>
      </div>
      <input type="text" autocomplete="off" [(ngModel)]="inputStringRendered" [attr.id]="question.getInputId()"
        [class]="question.cssClasses.filterStringInput" [attr.inputmode]="renderState.inputMode"
        [attr.readonly]="renderState.filterReadOnly ? true : null" [attr.disabled]="question.isDisabledAttr ? true : null"
        [attr.size]="!renderState.inputStringRendered ? 1 : null" [attr.role]="renderState.ariaInputRole"
        [attr.aria-required]="renderState.ariaInputRequired" [attr.aria-invalid]="renderState.ariaInputInvalid"
        [attr.aria-errormessage]="renderState.ariaInputErrorMessage" [attr.aria-expanded]="renderState.ariaInputExpanded"
        [attr.aria-label]="renderState.ariaInputLabel" [attr.aria-labelledby]="renderState.ariaInputLabelledby"
        [attr.aria-describedby]="renderState.ariaInputDescribedby" [attr.aria-controls]="renderState.ariaInputControls"
        [attr.aria-activedescendant]="renderState.ariaInputActivedescendant"
        [attr.placeholder]="renderState.filterStringPlaceholder" (keydown)="inputKeyHandler($event)"
        (blur)="question.onBlur($event)" (focus)="question.onFocus($event)" />
    </div>
  </div>
</ng-template>
