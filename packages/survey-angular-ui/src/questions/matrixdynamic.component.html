<ng-template #template>
  <div #contentElement>
    <div *ngIf="model.getShowToolbar('top')" [class]="model.cssClasses.headerBar">
      <sv-ng-action-bar [model]="model.toolbar"></sv-ng-action-bar>
    </div>
    <div *ngIf="model.sortBarLocation === 'top'" [class]="model.cssClasses.sortBarTop">
      <sv-ng-action-bar [model]="model.recordsBar.sortActions"></sv-ng-action-bar>
    </div>
    <sv-ng-matrix-table *ngIf="model.renderedTable?.showTable" [question]="model" [table]="model.renderedTable"></sv-ng-matrix-table>
    <sv-ng-placeholder-matrixdynamic *ngIf="!model.renderedTable.showTable" [question]="model"></sv-ng-placeholder-matrixdynamic>
    <div *ngIf="model.showPager || model.getShowToolbar('bottom')" [class]="model.cssClasses.footerBar">
      <sv-ng-action-bar *ngIf="model.getShowToolbar('bottom')" [model]="model.toolbar"></sv-ng-action-bar>
      <sv-ng-action-bar *ngIf="model.showPager" [model]="model.recordsBar.pagerActions"></sv-ng-action-bar>
    </div>
  </div>
</ng-template>
