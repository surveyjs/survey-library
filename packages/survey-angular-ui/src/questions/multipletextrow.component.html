<ng-template #template>
    <div [class]="question.cssClasses.row" *ngIf="model.isVisible">
        <ng-container *ngFor="let cell of model.cells; trackBy: trackItemBy">
            <div [class]="cell.className" [question]="question" [model]="cell" sv-ng-multipletext-item></div>
        </ng-container>
    </div>
</ng-template>
