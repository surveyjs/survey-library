<span *ngIf="question.getChoiceKeyBadge(model)" [class]="question.getItemShortcutKeyClass(model)" aria-hidden="true">{{ question.getChoiceKeyBadge(model) }}</span>

  [disabled]="!question.getItemEnabled(model)" [readonly]="question.isReadOnlyAttr" [(ngModel)]="renderedValue" [attr.value]="model.value" [value]="model.value" [attr.aria-label]="ariaLabel" [attr.aria-labelledby]="!ariaLabel && !model.hideCaption ? question.getItemLabelId(model) : null" [attr.aria-keyshortcuts]="question.getItemAriaKeyShortcuts(model)"
  (keydown)="question.onKeyDown($event)"
  (focusout)="question.onChoiceFocusOut($event)"
/>
