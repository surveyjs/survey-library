<div class="sv-popup__body-content">
	<div class="sv-popup__scrolling-content">
		<div class="sv-popup__content">
			<div class="sv-calendar">
				<div class="sv-calendar__toolbar">
					<div class="sd-action-bar sd-action-bar--default-size sv-calendar__toolbar-actions">
						<div class="sd-action-bar__item sv-calendar__nav-button">
							<div class="sd-action-bar__item-content">
								<button class="sd-action sd-action--neutral sd-action--small sd-action--tertiary" role="button" tabindex="-1" type="button">
									<svg class="sd-action__icon sv-svg-icon" role="presentation">
										<use xlink:href="#icon-chevronleft-24x24" class="">
										</use>
									</svg>
								</button>
							</div>
						</div>
						<div class="sd-action-bar__item sv-calendar__title">
							<div class="sd-action-bar__item-content">
								<button class="sd-action sd-action--neutral sd-action--small sd-action--tertiary" role="button" tabindex="0" type="button">
									<svg class="sd-action__icon sv-svg-icon" role="presentation">
										<use xlink:href="#icon-chevrondown-16x16" class="">
										</use>
										<title class="">1990</title>
									</svg>
									<span class="sd-action__title">1990</span>
								</button>
							</div>
						</div>
						<div class="sd-action-bar__item sv-calendar__nav-button">
							<div class="sd-action-bar__item-content">
								<button class="sd-action sd-action--neutral sd-action--small sd-action--tertiary" disabled="" role="button" tabindex="-1" type="button">
									<svg class="sd-action__icon sv-svg-icon" role="presentation">
										<use xlink:href="#icon-chevronright-24x24" class="">
										</use>
									</svg>
								</button>
							</div>
						</div>
					</div>
				</div>
				<div class="sv-calendar__table">
					<div class="sv-calendar__month">January</div>
					<div class="sv-calendar__month">February</div>
					<div class="sv-calendar__month sv-calendar__month--selected">March</div>
					<div class="sv-calendar__month">April</div>
					<div class="sv-calendar__month">May</div>
					<div class="sv-calendar__month">June</div>
					<div class="sv-calendar__month">July</div>
					<div class="sv-calendar__month">August</div>
					<div class="sv-calendar__month">September</div>
					<div class="sv-calendar__month">October</div>
					<div class="sv-calendar__month sv-calendar__month--disabled">November</div>
					<div class="sv-calendar__month sv-calendar__month--disabled">December</div>
				</div>
			</div>
		</div>
	</div>
</div>
