<div class="sd-question__header-and-content-container">
	<div class="sd-question__content sd-question__content--dropdown" role="presentation">
		<div class="sd-selectbase">
			<div class="sv-dropdown_select-wrapper">
				<div class="sd-dropdown sd-formbox">
					<div class="sd-dropdown__input sd-formbox__input">
						<div class="sd-dropdown__input-prefix-wrapper">
							<span class="sv-string-viewer">Other (describe)</span>
							<input aria-controls="testid0i_list" aria-expanded="false" aria-invalid="false" aria-label="Question title" aria-required="false" autocomplete="off" class="sd-dropdown__filter-string-input" inputmode="text" placeholder="" readonly="" role="combobox" type="text">
						</div>
					</div>
					<div class="sd-action-bar sd-action-bar--default-size sd-formbox__group">
						<div class="sd-action-bar__item sd-editor-clean-button">
							<div class="sd-action-bar__item-content">
								<button class="sd-action sd-action--neutral sd-action--small sd-action--tertiary" data-sv-tooltip="Clear" role="button" tabindex="-1" title="Clear" type="button">
									<svg class="sd-action__icon sv-svg-icon" role="presentation">
										<use xlink:href="#icon-cancel-24x24" class="">
										</use>
										<title class="">Clear</title>
									</svg>
								</button>
							</div>
						</div>
						<div class="sd-action-bar__item sd-editor-chevron-button">
							<div class="sd-action-bar__item-content">
								<button class="sd-action sd-action--neutral sd-action--small sd-action--tertiary" data-sv-tooltip="Select" role="button" tabindex="-1" title="Select" type="button">
									<svg class="sd-action__icon sv-svg-icon" role="presentation">
										<use xlink:href="#icon-chevrondown-24x24" class="">
										</use>
										<title class="">Select</title>
									</svg>
								</button>
							</div>
						</div>
					</div>
				</div>
				<div>
				</div>
			</div>
			<div class="form-group sd-question__comment-area">
				<div class="sd-comment sd-formbox">
					<textarea aria-label="Question title" aria-required="false" class="sd-comment__input sd-formbox__input" placeholder="" style="resize:none;">
					</textarea>
					<div class="sd-comment__grip">
						<svg class="sv-svg-icon" role="presentation">
							<use xlink:href="#icon-grip" class="">
							</use>
						</svg>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
