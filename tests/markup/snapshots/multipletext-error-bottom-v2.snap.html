<div class="sd-question__header-and-content-container">
	<div class="sd-question__content sd-question__content--multipletext" role="presentation">
		<div class="sd-multipletext">
			<div class="sd-multipletext__row">
				<div class="sd-multipletext__cell">
					<label class="sd-formbox sd-formbox--error sd-multipletext__item-container sd-multipletext__item-container--allow-focus">
						<span class="sd-formbox__label sd-multipletext__item-title">
							<span class="sv-string-viewer sv-string-viewer--multiline">Text 1</span>
							<span>&nbsp;</span>
							<span aria-hidden="true" class="sd-question__required-text">*</span>
						</span>
						<div class="sd-multipletext__item">
							<div class="sd-formbox sd-formbox--error sd-text">
								<input aria-invalid="true" aria-label="Text 1" aria-required="true" class="sd-formbox__input" placeholder="" type="text">
							</div>
						</div>
					</label>
				</div>
			</div>
			<div class="sd-multipletext__row">
				<div class="sd-multipletext__cell sd-multipletext__cell--error sd-multipletext__cell--error-bottom">
					<div aria-atomic="true" aria-live="polite" class="sd-element__erbox sd-error sd-question__erbox sd-question__erbox--below-question" role="alert">
						<div>
							<span aria-hidden="true">
							</span>
							<span class="sd-error__item">
								<span class="sv-string-viewer">Response required.</span>
							</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
